# radarpi 配置文件
#
# 位置：/etc/radarpi/radarpi.conf（系统）或 ~/.config/radarpi/radarpi.conf（用户）
# 修改后执行：sudo systemctl restart radarpi-web
# 也可以用命令改：radarpi config set radar.boundary "-3 3 0.8 0.2 5"

[serial]
# 串口设备：auto 表示自动识别（推荐）；也可写稳定别名 /dev/serial/by-id/...
# 或 udev 别名 /dev/radar
device = auto
# 波特率：手册规定 3000000，一般不要改
baudrate = 3000000
# 串口读超时（秒）
read_timeout = 0.2
# 连接后自动下发 scan start
auto_start = true
# 掉线自动重连（推荐保持 true，适合无人值守）
reconnect = true

[radar]
# 连接后是否自动下发下面这些雷达参数
apply_on_connect = true
# 雷达安装高度（m）—— 对应指令 set radar_height
radar_height = 1.7
# 安装倾斜角度（度）—— 对应指令 set radar_inclination
radar_inclination = 30
# 点云输出范围 —— 对应指令 set boundary（5 个数值，按手册示例填写）
boundary = -3 3 0.8 0.2 5
# 长时/短时微动点处理间隔（帧）—— 对应指令 set_mmsinterval
mmsinterval = 2 34
# 动态/短时微动/长时微动检测门限系数 —— 对应指令 set_cfar_coeff
cfar_coeff = 33 44 55

[web]
# 监听地址：0.0.0.0 = 局域网内可访问；127.0.0.1 = 仅本机
host = 0.0.0.0
port = 8080
# 每帧最多推送给浏览器的点数（树莓派 + 无线网络下建议 2000~8000）
max_points_sent = 4000
# 网页刷新上限（帧/秒）
max_fps = 15
# 是否推送航迹包
tracks = true

[record]
# 录制文件目录
directory = /var/lib/radarpi
# 录制格式：csv（一行一点，便于 Excel 分析）或 jsonl（一行一帧，回放最快）
format = csv
# 服务启动后是否立即开始录制
autostart = false
